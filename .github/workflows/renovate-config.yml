name: "Renovate config"
on:
  push:
    paths:
      - 'renovate.json'
      - '.github/workflows/renovate-config.yml'
  pull_request:
    paths:
      - 'renovate.json'
      - '.github/workflows/renovate-config.yml'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Validate Renovate config'
        uses: suzuki-shunsuke/github-action-renovate-config-validator@v2.2.0
        with:
          config_file_path: renovate.json
